name: Browser regression tests

on:
  push:
    branches:
      - main
      - work/windows-standalone-midi-audit
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/browser-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/browser-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run song I/O regression tests
        run: npm test

      - name: Build browser application
        run: npm run build
